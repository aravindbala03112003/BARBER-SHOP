name: Keep Application & Database Always Alive

on:
  schedule:
    # Trigger every 14 minutes to prevent Render free tier from sleeping (spins down after 15m)
    # and to keep TiDB Cloud MySQL database connection active
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  ping-health:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Barber Shop Live Health Check (Vercel & Render)
        run: |
          echo "Pinging production application on Vercel..."
          VERCEL_RES=$(curl -s -w "\nHTTP_STATUS:%{http_code}" https://barber-shop-six-lyart.vercel.app/api/health)
          echo "$VERCEL_RES"

          echo "Pinging standby application on Render..."
          RENDER_RES=$(curl -s -w "\nHTTP_STATUS:%{http_code}" https://barber-shop-0jlh.onrender.com/api/health)
          echo "$RENDER_RES"

          echo "Successfully pinged application endpoints. TiDB Cloud MySQL and services are active!"
